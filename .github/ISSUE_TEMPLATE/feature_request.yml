name: Feature request
description: An idea to make OBS Bakeup better
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you ran into, rather than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: dropdown
    id: system
    attributes:
      label: Which system is this about?
      options:
        - Windows
        - macOS
        - Both
    validations:
      required: true
